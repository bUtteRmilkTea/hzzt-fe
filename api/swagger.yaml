        type''s base-currency value and `driftPct` (actual - target), plus the type''s
        `assignedPct` and `unallocatedPct` (100 - assigned). A wrapper whose percentage
        is set but that no longer holds any investment is still listed (actualPct
        0.00). The same fields are embedded in GET /investments/grouped.'
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
