basePath: /api/v1
definitions:
  auth.AuthResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        description: seconds
        example: 900
        type: integer
      user:
        $ref: '#/definitions/auth.UserDTO'
    type: object
  auth.MessageResponse:
    properties:
      message:
        type: string
    type: object
  auth.UserDTO:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      lastActiveSpaceId:
        type: string
      name:
        type: string
      timezone:
        type: string
    type: object
  auth.changePasswordRequest:
    properties:
      currentPassword:
        maxLength: 128
        type: string
      newPassword:
        maxLength: 128
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  auth.forgotPasswordRequest:
    properties:
      email:
        maxLength: 254
        type: string
    required:
    - email
    type: object
  auth.loginRequest:
    properties:
      email:
        maxLength: 254
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  auth.registerRequest:
    properties:
      email:
        example: jane@example.com
        maxLength: 254
        type: string
      name:
        example: Jane
        maxLength: 60
        minLength: 1
        type: string
      password:
        example: correct horse battery
        maxLength: 128
        type: string
      timezone:
        example: Asia/Jakarta
        maxLength: 64
        type: string
    required:
    - email
    - name
    - password
    type: object
  auth.resetPasswordRequest:
    properties:
      newPassword:
        maxLength: 128
        type: string
      token:
        maxLength: 256
        type: string
    required:
    - newPassword
    - token
    type: object
  categories.CategoryDTO:
    properties:
      budgetAmount:
        example: "500000"
        type: string
      budgetCurrency:
        description: the space's base currency when a budget is set
        example: IDR
        type: string
      color:
        type: string
      createdAt:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      sortOrder:
        type: integer
      stats:
        allOf:
        - $ref: '#/definitions/categories.StatsDTO'
        description: only with includeStats=true
      systemKey:
        description: |-
          SystemKey is the stable key of a default category (SALARY, SUBSCRIPTIONS, ...) so the client can
          localize its name; null for categories the user created. A rename never changes it.
        type: string
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    type: object
  categories.StatsDTO:
    properties:
      budgetRemaining:
        type: string
      budgetUsedPct:
        type: string
      currency:
        example: IDR
        type: string
      received:
        type: string
      spent:
        type: string
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  categories.createRequest:
    properties:
      budgetAmount:
        type: string
      color:
        maxLength: 16
        type: string
      icon:
        maxLength: 64
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    required:
    - color
    - icon
    - name
    - type
    type: object
  categories.reorderRequest:
    properties:
      ids:
        items:
          type: string
        maxItems: 500
        type: array
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    required:
    - ids
    - type
    type: object
  categories.updateRequest:
    properties:
      budgetAmount:
        type: string
      color:
        maxLength: 16
        type: string
      icon:
        maxLength: 64
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    type: object
  currency.AggregateResult:
    properties:
      breakdown:
        items:
          $ref: '#/definitions/currency.BreakdownEntry'
        type: array
      currency:
        type: string
      total:
        type: number
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  currency.BreakdownEntry:
    properties:
      converted:
        type: number
      currency:
        type: string
      original:
        type: number
    type: object
  currency.Currency:
    properties:
      code:
        type: string
      minorUnits:
        type: integer
      name:
        type: string
      symbol:
        type: string
    type: object
  currency.LatestResponse:
    properties:
      asOf:
        example: "2026-11-18"
        type: string
      base:
        example: IDR
        type: string
      rates:
        additionalProperties:
          type: string
        type: object
      source:
        example: freecurrencyapi
        type: string
    type: object
  currency.ManualRateDTO:
    properties:
      base:
        example: USD
        type: string
      quote:
        example: IDR
        type: string
      rate:
        example: "16000"
        type: string
      updatedAt:
        type: string
    type: object
  currency.Warning:
    properties:
      code:
        type: string
      label:
        type: string
      message:
        type: string
    type: object
  currency.putManualRequest:
    properties:
      rate:
        example: "16000"
        type: string
    required:
    - rate
    type: object
  dashboard.AnalyticsDTO:
    properties:
      buckets:
        items:
          $ref: '#/definitions/dashboard.BucketDTO'
        type: array
      currency:
        example: USD
        type: string
      period:
        $ref: '#/definitions/dashboard.PeriodDTO'
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  dashboard.BreakdownDTO:
    properties:
      currency:
        example: USD
        type: string
      items:
        items:
          $ref: '#/definitions/dashboard.CategoryShareDTO'
        type: array
      period:
        $ref: '#/definitions/dashboard.PeriodDTO'
      total:
        type: string
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
      uncategorized:
        $ref: '#/definitions/dashboard.CategoryShareDTO'
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  dashboard.BucketDTO:
    properties:
      expense:
        type: string
      fromDate:
        example: "2026-11-29"
        type: string
      income:
        type: string
      label:
        example: 29–30 Nov
        type: string
      toDate:
        example: "2026-11-30"
        type: string
    type: object
  dashboard.CalendarDTO:
    properties:
      currency:
        example: USD
        type: string
      days:
        items:
          $ref: '#/definitions/dashboard.DayDTO'
        type: array
      month:
        example: 2026-11
        type: string
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  dashboard.CategoryShareDTO:
    properties:
      amount:
        type: string
      categoryId:
        type: string
      color:
        type: string
      count:
        type: integer
      icon:
        type: string
      name:
        type: string
      pct:
        description: a percentage of the total
        example: "42.50"
        type: string
    type: object
  dashboard.ChangeDTO:
    properties:
      expensePct:
        type: string
      incomePct:
        type: string
      netPct:
        type: string
    type: object
  dashboard.DayDTO:
    properties:
      count:
        type: integer
      date:
        example: "2026-11-18"
        type: string
      expense:
        type: string
      income:
        type: string
      net:
        type: string
    type: object
  dashboard.OverviewDTO:
    properties:
      change:
        $ref: '#/definitions/dashboard.ChangeDTO'
      currency:
        example: USD
        type: string
      expense:
        type: string
      income:
        type: string
      net:
        type: string
      period:
        $ref: '#/definitions/dashboard.PeriodDTO'
      previous:
        allOf:
        - $ref: '#/definitions/dashboard.TotalsDTO'
        description: null for ALL_TIME
      transactionCount:
        type: integer
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  dashboard.PeriodDTO:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  dashboard.TotalsDTO:
    properties:
      expense:
        type: string
      income:
        type: string
      net:
        type: string
      transactionCount:
        type: integer
    type: object
  goals.AllocationDTO:
    properties:
      amount:
        description: in the wallet's currency
        example: "100"
        type: string
      converted:
        description: in the goal's currency; null without an FX rate
        type: string
      walletCurrency:
        example: IDR
        type: string
      walletIcon:
        type: string
      walletId:
        type: string
      walletName:
        type: string
    type: object
  goals.GoalDTO:
    properties:
      achievedAt:
        type: string
      allocations:
        items:
          $ref: '#/definitions/goals.AllocationDTO'
        type: array
      color:
        example: '#22C55E'
        type: string
      createdAt:
        type: string
      currency:
        example: USD
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      progress:
        description: Progress is the sum of the reservations converted to the goal's
          currency.
        type: string
      progressPct:
        description: ProgressPct is a percentage (50.00 = half way); over 100 means
          exceeded.
        type: string
      remaining:
        type: string
      requiredMonthly:
        description: RequiredMonthly is remaining / months until the target date;
          null without a date, after it, or once achieved.
        type: string
      targetAmount:
        example: "1000"
        type: string
      targetDate:
        example: "2026-12-31"
        type: string
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  goals.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/goals.GoalDTO'
        type: array
    type: object
  goals.allocationRequest:
    properties:
      amount:
        example: "100"
        type: string
    required:
    - amount
    type: object
  goals.createRequest:
    properties:
      color:
        maxLength: 16
        type: string
      currency:
        maxLength: 8
        type: string
      icon:
        maxLength: 64
        type: string
      initialReserve:
        $ref: '#/definitions/goals.reserveRequest'
      name:
        maxLength: 120
        minLength: 1
        type: string
      targetAmount:
        example: "1000"
        type: string
      targetDate:
        example: "2026-12-31"
        maxLength: 10
        type: string
    required:
    - color
    - icon
    - name
    - targetAmount
    type: object
  goals.reserveRequest:
    properties:
      amount:
        example: "100"
        type: string
      walletId:
        type: string
    required:
    - amount
    - walletId
    type: object
  goals.updateRequest:
    properties:
      color:
        maxLength: 16
        type: string
      currency:
        maxLength: 8
        type: string
      icon:
        maxLength: 64
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      targetAmount:
        type: string
      targetDate:
        type: string
    type: object
  httpx.ErrorBody:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
    type: object
  httpx.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/httpx.ErrorBody'
      requestId:
        type: string
    type: object
  investments.AcceptResponse:
    properties:
      investmentId:
        type: string
      spaceId:
        type: string
    type: object
  investments.AllocationsResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/investments.CategoryAllocationDTO'
        type: array
      currency:
        example: IDR
        type: string
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  investments.BaseValues:
    properties:
      costBasis:
        type: string
      currency:
        example: IDR
        type: string
      fxAsOf:
        type: string
      fxRate:
        description: 'FxRate is the rate used: base-currency units per 1 quote-currency
          unit.'
        example: "16000"
        type: string
      fxSource:
        description: FxSource is PROVIDER (the stored provider rate) or MANUAL (a
          typed rate); FxAsOf is the date of the provider rate.
        enum:
        - PROVIDER
        - MANUAL
        type: string
      marketValue:
        type: string
      unrealizedPl:
        type: string
    type: object
  investments.CategoryAllocationDTO:
    properties:
      assetType:
        enum:
        - CRYPTO
        - ID_STOCK
        - US_STOCK
        - MUTUAL_FUND
        - GLOBAL_ETF
        type: string
      assignedPct:
        example: "70.00"
        type: string
      label:
        example: Crypto
        type: string
      unallocatedPct:
        example: "30.00"
        type: string
      wrappers:
        items:
          $ref: '#/definitions/investments.WrapperAllocationDTO'
        type: array
    type: object
  investments.CategoryGroupDTO:
    properties:
      assetType:
        enum:
        - CRYPTO
        - ID_STOCK
        - US_STOCK
        - MUTUAL_FUND
        - GLOBAL_ETF
        type: string
      assignedPct:
        description: AssignedPct is the sum of the wrapper percentages set in this
          asset type; UnallocatedPct = 100 - assigned.
        example: "70.00"
        type: string
      cost:
        example: "700000"
        type: string
      label:
        example: Crypto
        type: string
      pctOfTotal:
        example: "60.00"
        type: string
      unallocatedPct:
        example: "30.00"
        type: string
      unrealizedPl:
        example: "200000"
        type: string
      unrealizedPlPct:
        example: "28.57"
        type: string
      value:
        example: "900000"
        type: string
      wrappers:
        items:
          $ref: '#/definitions/investments.WrapperGroupDTO'
        type: array
    type: object
  investments.CategoryTotalsDTO:
    properties:
      assignedPct:
        example: "70.00"
        type: string
      unallocatedPct:
        example: "30.00"
        type: string
    type: object
  investments.CreateRequestDoc:
    properties:
      assetType:
        enum:
        - CRYPTO
        - ID_STOCK
        - US_STOCK
        - MUTUAL_FUND
        - GLOBAL_ETF
        type: string
      avgBuyPrice:
        example: "9200"
        type: string
      details:
        type: object
      estimatedAnnualChangePct:
        example: "5.5"
        type: string
      fees:
        type: string
      funding:
        allOf:
        - $ref: '#/definitions/investments.Funding'
        description: Funding pays the initial position from a wallet (optional).
      icon:
        type: string
      manualCurrentValue:
        type: string
      manualFxRate:
        example: "16000"
        type: string
      manualPrice:
        example: "9500"
        type: string
      name:
        example: Bank Central Asia
        type: string
      priceMode:
        type: string
      purchaseDate:
        example: "2026-01-31"
        type: string
      quantity:
        example: "0.5"
        type: string
      quoteCurrency:
        type: string
      symbol:
        type: string
      wrapper:
        description: Wrapper is the exchange, broker or platform holding the position
          (1 to 60 characters). When omitted it is derived from details (exchangeOrWallet,
          broker or platform).
        example: Binance
        type: string
    type: object
  investments.FieldMeta:
    properties:
      kind:
        enum:
        - TEXT
        - INTEGER
        - DECIMAL
        - DATE
        - ENUM
        type: string
      label:
        example: Staked quantity
        type: string
      name:
        example: stakedQuantity
        type: string
      options:
        items:
          type: string
        type: array
      required:
        type: boolean
    type: object
  investments.Funding:
    properties:
      amount:
        example: "1000000"
        type: string
      walletId:
        type: string
    type: object
  investments.GroupedResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/investments.CategoryGroupDTO'
        type: array
      currency:
        example: IDR
        type: string
      total:
        $ref: '#/definitions/investments.TotalsDTO'
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  investments.InvestmentDTO:
    properties:
      assetType:
        enum:
        - CRYPTO
        - ID_STOCK
        - US_STOCK
        - MUTUAL_FUND
        - GLOBAL_ETF
        type: string
      avgBuyPrice:
        type: string
      createdAt:
        type: string
      details:
        type: object
      estimatedAnnualChangePct:
        description: EstimatedAnnualChangePct is the user's own assumed yearly change
          in percent; null when never set (there is no default).
        type: string
      fees:
        type: string
      fxAsOf:
        type: string
      fxRate:
        description: |-
          FxRate, FxSource and FxAsOf describe the quote-to-base rate behind valuation.base: the rate used (base units per 1 quote
          unit), whether it came from the rate provider (PROVIDER) or was typed (MANUAL), and the date of the provider rate.
          All null when the quote currency is the space base currency or no rate is available.
        example: "16000"
        type: string
      fxSource:
        enum:
        - PROVIDER
        - MANUAL
        type: string
      icon:
        type: string
      id:
        type: string
      instrumentId:
        type: string
      isShared:
        type: boolean
      manualCurrentValue:
        type: string
      manualFxRate:
        description: ManualFxRate is an optional per-investment override, used only
          when the space's automatic FX is off.
        type: string
      manualPrice:
        type: string
      myShareBps:
        example: 3000
        type: integer
      name:
        type: string
      ownership:
        description: |-
          Ownership is OWNER for this space's own investments and SHARED_IN for ones
          others shared into it (read-only).
        enum:
        - OWNER
        - SHARED_IN
        type: string
      participants:
        items:
          $ref: '#/definitions/investments.ParticipantDTO'
        type: array
      pctOfTotal:
        allOf:
        - $ref: '#/definitions/money.Pct'
        description: PctOfTotal is this investment's share of the portfolio's base-currency
          value (only in the list response; null without a base value).
      priceMode:
        enum:
        - AUTO
        - MANUAL
        type: string
      purchaseDate:
        example: "2026-01-31"
        type: string
      quantity:
        example: "200"
        type: string
      quoteCurrency:
        example: IDR
        type: string
      realizedPl:
        $ref: '#/definitions/investments.RealizedPLDTO'
      symbol:
        type: string
      totalValuation:
        allOf:
        - $ref: '#/definitions/investments.Valuation'
        description: TotalValuation is the whole investment's valuation; present only
          for shared investments.
      updatedAt:
        type: string
      valuation:
        allOf:
        - $ref: '#/definitions/investments.Valuation'
        description: 'Valuation is the viewer''s part: the whole investment unless
          it is shared.'
      wrapper:
        description: Wrapper is the exchange, broker or platform the position is held
          on; null when unknown.
        example: Binance
        type: string
    type: object
  investments.InvitationDTO:
    properties:
      investment:
        properties:
          assetType:
            type: string
          icon:
            type: string
          name:
            type: string
          symbol:
            type: string
        type: object
      invitedAt:
        type: string
      ownerName:
        type: string
      participantId:
        type: string
      shareBps:
        type: integer
      sharePct:
        example: "30.00"
        type: string
    type: object
  investments.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/investments.InvestmentDTO'
        type: array
      summary:
        $ref: '#/definitions/investments.Summary'
    type: object
  investments.ParticipantDTO:
    properties:
      displayName:
        type: string
      email:
        type: string
      id:
        type: string
      invitedAt:
        type: string
      isMe:
        type: boolean
      role:
        enum:
        - OWNER
        - PARTICIPANT
        type: string
      shareBps:
        example: 3000
        type: integer
      sharePct:
        example: "30.00"
        type: string
      status:
        enum:
        - ACTIVE
        - INVITED
        - DECLINED
        - REMOVED
        type: string
    type: object
  investments.ParticipantsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/investments.ParticipantDTO'
        type: array
    type: object
  investments.PatchInput:
    properties:
      assetType:
        type: string
      avgBuyPrice:
        type: string
      details:
        type: object
      estimatedAnnualChangePct:
        type: string
      fees:
        type: string
      icon:
        maxLength: 64
        type: string
      instrumentId:
        description: InstrumentID relinks an auto-priced investment to an instrument
          picked from search.
        type: string
      manualCurrentValue:
        type: string
      manualFxRate:
        type: string
      manualPrice:
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      priceMode:
        enum:
        - AUTO
        - MANUAL
        type: string
      purchaseDate:
        type: string
      quantity:
        type: string
      quoteCurrency:
        maxLength: 8
        type: string
      symbol:
        type: string
      wrapper:
        description: Wrapper sets the exchange, broker or platform holding the position;
          null re-derives it from details.
        type: string
    type: object
  investments.RealizedPLDTO:
    properties:
      amount:
        description: Amount is in the investment's quote currency, Base in the space's
          base currency (null without an FX rate).
        example: "5990.00"
        type: string
      base:
        type: string
      currency:
        example: USD
        type: string
      sells:
        type: integer
    type: object
  investments.SetParticipantsRequest:
    properties:
      participants:
        items:
          $ref: '#/definitions/investments.participantRequest'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - participants
    type: object
  investments.SetParticipantsResponse:
    properties:
      investment:
        $ref: '#/definitions/investments.InvestmentDTO'
      items:
        items:
          $ref: '#/definitions/investments.ParticipantDTO'
        type: array
    type: object
  investments.SetTargetRequest:
    properties:
      targetPct:
        description: TargetPct is a percentage from 0 to 100 with at most 2 decimals
          ("40.00"); null clears it.
        example: "40.00"
        type: string
    type: object
  investments.SetTargetResponse:
    properties:
      actualPct:
        description: ActualPct is the wrapper's share of its asset type's value; null
          when the asset type is worth 0.
        example: "33.33"
        type: string
      assetType:
        enum:
        - CRYPTO
        - ID_STOCK
        - US_STOCK
        - MUTUAL_FUND
        - GLOBAL_ETF
        type: string
      category:
