            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List investments with valuations and a portfolio summary
      tags:
      - investments
    post:
      consumes:
      - application/json
      description: 'The body is validated by `assetType` (see GET /investment-types).
        ID_STOCK takes `details.lots` and derives quantity = lots × 100. CRYPTO checks
        `details.stakedQuantity` <= quantity. `priceMode: AUTO` is accepted for CRYPTO,
        US_STOCK and GLOBAL_ETF and answers 422 AUTO_PRICE_NOT_SUPPORTED otherwise.
        A CRYPTO created without `priceMode` is AUTO by default and linked to its
        CoinMarketCap coin by symbol; if the symbol is unknown or ambiguous the holding
        is created as MANUAL and `valuation.warnings` carries `PRICE_NOT_LINKED` (an
        explicit `priceMode` never falls back). Valuation warnings also include `PRICE_STALE`
        (a stale market price still counts and is flagged) and `MANUAL_VALUE_OVERRIDES_MARKET`
        (an AUTO holding with a manual current value, which wins). An AUTO investment
        is linked to a market instrument: send the `instrumentId` picked from GET
        /market/crypto/search (CRYPTO) or GET /market/stocks/search (US_STOCK, GLOBAL_ETF),
        or the symbol is resolved to the highest-ranked coin / the exact ticker (422
        INSTRUMENT_NOT_FOUND if none matches). Without a market price the manual price
        is used. Optional `funding: {walletId, amount?}` pays for the initial position
        from a wallet: it creates a BUY titled "Initial position {symbol}" (wallet
        debited quantity × avgBuyPrice + fees, converted to the wallet''s currency
        unless `amount` is given) in the same database transaction.'
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Investment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/investments.CreateRequestDoc'
      produces:
      - application/json
      responses:
        "201":
