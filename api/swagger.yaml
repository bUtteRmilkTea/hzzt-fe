  /spaces/{spaceId}/transfers:
    post:
      consumes:
      - application/json
      description: '`from` and `to` are `{type:"WALLET", walletId}` or `{type:"INVESTMENT",
        investmentId, quantity, unitPrice, fee?}`.\n\n**Wallet → wallet**: `toAmount`
        is required when the wallets use different currencies (the stored rate is
        toAmount / amount); for the same currency it must equal `amount` or be omitted.
        Negative balances are allowed.\n\n**BUY** (wallet → investment): the wallet
        is debited quantity × unitPrice + fee, converted to the wallet''s currency
        unless `amount` is given; the position becomes new_qty = q + Δq and new_avg
        = (q × avg + Δq × unitPrice) / new_qty, fees += fee.\n\n**SELL** (investment
        → wallet): the wallet is credited quantity × unitPrice − fee; the average
        stays; `realizedPl` = (unitPrice − avg) × Δq − fee. Selling more than quantity
        − stakedQuantity answers 422 INSUFFICIENT_QUANTITY.\n\nInvestment → investment
        is not supported. Transfers and trades never count as income or expense; they
        show in the `transfer` column of the daily summary and in the history of the
        wallet.'
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Transfer, BUY or SELL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/transfers.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/transactions.TransactionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: OWNER_ONLY (BUY/SELL on an investment shared into this space)
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: space, wallet or investment not found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: TRANSFER_SAME_WALLET / TRANSFER_AMOUNT_REQUIRED / NOT_SUPPORTED_YET
            / INSUFFICIENT_QUANTITY / FX_RATE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Transfer between wallets, or buy/sell an investment through a wallet
      tags:
      - transfers
  /spaces/{spaceId}/transfers/{id}:
    delete:
      description: A BUY/SELL can only be deleted while the investment's position
        is still the one it left behind (409 POSITION_CHANGED_SINCE).
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Transfer ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: OWNER_ONLY (BUY/SELL on an investment shared into this space)
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: POSITION_CHANGED_SINCE
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a transfer, BUY or SELL (balances and position are restored)
      tags:
      - transfers
    patch:
      consumes:
      - application/json
      description: Any field may be sent; the old effect is reversed and the new one
        applied atomically. For wallet transfers, changing the amount or either wallet
        of a cross-currency transfer requires `toAmount`. For a BUY/SELL, send the
        investment side as `{type:"INVESTMENT", quantity?, unitPrice?, fee?}` and
        the wallet side as `{type:"WALLET", walletId}`; the investment itself cannot
        change. A BUY/SELL can only be edited (or deleted) while the investment's
        position is still the one it left behind, otherwise 409 POSITION_CHANGED_SINCE.
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Transfer ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/transfers.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transactions.TransactionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: OWNER_ONLY (BUY/SELL on an investment shared into this space)
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: POSITION_CHANGED_SINCE
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: TRANSFER_SAME_WALLET / TRANSFER_AMOUNT_REQUIRED / NOT_SUPPORTED_YET
            / INSUFFICIENT_QUANTITY
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Edit a transfer, BUY or SELL
      tags:
      - transfers
