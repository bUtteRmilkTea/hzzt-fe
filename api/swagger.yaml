        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: AUTO_PRICE_NOT_SUPPORTED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create an investment
      tags:
      - investments
