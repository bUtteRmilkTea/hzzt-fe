      - transactions
    patch:
      consumes:
      - application/json
      description: 'INCOME/EXPENSE: any field (the old balance effect is reversed
        and the new one applied atomically). ADJUSTMENT/OPENING_BALANCE: only `note`.
        `type: ADJUSTMENT` on an uncategorised INCOME/EXPENSE reclassifies it explicitly
        as a balance adjustment (IN for income, OUT for expense; the wallet balance
        does not change); a categorised one, or any other type change, returns TYPE_CHANGE_NOT_ALLOWED.
        Transfers and investment/asset transactions use their own endpoints (USE_SPECIFIC_ENDPOINT).
        `categoryId`, `title` and `note` accept null to clear.'
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
