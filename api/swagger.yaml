  /spaces/{spaceId}/investments/grouped:
    get:
      description: 'Groups the same valued list as GET /investments by asset type,
        then by wrapper (exchange, broker or platform; compared case- and whitespace-insensitively;
        none is `wrapper: null`, key `_unassigned`). Sums use the viewer''s base-currency
        values, so they equal `summary` of the flat list; items without a usable FX
        rate are listed but left out of every sum and reported in `warnings`. `pctOfCategory`
