        - TEMPLATE
        type: string
      presetId:
        type: string
      templateId:
        type: string
    type: object
  wallets.DeleteImpactDTO:
    properties:
      balance:
        example: "134.26"
        type: string
      currency:
        example: USD
        type: string
      goalReserves:
        description: GoalReserves is the number of goal reservations that are removed
          with the wallet.
        example: 1
        type: integer
      transactions:
        description: |-
          Transactions counts every transaction that points at the wallet (the history that stays behind); Transfers is how many
          of them are transfers to or from another of the space's wallets.
        example: 12
        type: integer
      transfers:
        example: 3
        type: integer
    type: object
  wallets.DisplayPrefs:
    properties:
      hideLogo:
        type: boolean
      hideName:
        type: boolean
      hideType:
        type: boolean
    type: object
  wallets.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/wallets.WalletDTO'
        type: array
      total:
        $ref: '#/definitions/currency.AggregateResult'
    type: object
  wallets.PrefsRequest:
    properties:
      hideLogo:
        type: boolean
      hideName:
        type: boolean
      hideType:
        type: boolean
    type: object
  wallets.Preset:
    properties:
      colors:
        items:
          type: string
        type: array
      direction:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  wallets.Template:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  wallets.WalletDTO:
    properties:
      available:
        example: "34.26"
        type: string
      balance:
        description: 'Balance, Reserved and Available are in the wallet''s currency:
          IDR and JPY show no decimals, others 2.'
        example: "134.26"
        type: string
      baseBalance:
        description: |-
          BaseBalance and PctOfTotal are set in the list response only: the balance in the space's
          base currency, and its share of the total (percentages add up to exactly 100.00). Null
          without an FX rate, or when the total is 0.
        example: "2150000"
        type: string
      cardStyle:
        $ref: '#/definitions/wallets.CardStyle'
      createdAt:
        type: string
      currency:
        example: IDR
        type: string
      displayPrefs:
        allOf:
        - $ref: '#/definitions/wallets.DisplayPrefs'
        description: |-
          DisplayPrefs are the calling user's own display choices for this wallet (all false by default);
          other members never see them.
      icon:
        type: string
      id:
        type: string
      isFavorite:
        type: boolean
      name:
        type: string
      overReserved:
        type: boolean
      pctOfTotal:
        example: "33.33"
        type: string
      reserved:
        description: |-
          Reserved is the part of the balance earmarked for goals; Available = balance − reserved
          and may be negative when expenses pushed the wallet below its reserves (OverReserved).
        example: "100.00"
        type: string
      sortOrder:
        type: integer
      type:
        enum:
        - BANK
        - E_WALLET
        - CASH
        - OTHER
        type: string
    type: object
  wallets.createRequest:
    properties:
      cardStyle:
        type: object
      currency:
        maxLength: 8
        type: string
      icon:
        maxLength: 64
        type: string
      initialBalance:
        example: "134.26"
        type: string
      isFavorite:
        type: boolean
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - BANK
        - E_WALLET
        - CASH
        - OTHER
        type: string
    required:
    - icon
    - name
    - type
    type: object
  wallets.reorderRequest:
    properties:
      ids:
        items:
          type: string
        maxItems: 500
        type: array
    required:
    - ids
    type: object
  wallets.setBalanceRequest:
    properties:
      newBalance:
        example: "100"
        type: string
      note:
        maxLength: 500
        type: string
    required:
    - newBalance
    type: object
  wallets.updateRequest:
    properties:
      cardStyle:
        type: object
      currency:
        maxLength: 8
        type: string
      icon:
        maxLength: 64
        type: string
      isFavorite:
        type: boolean
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - BANK
        - E_WALLET
        - CASH
        - OTHER
        type: string
    type: object
info:
  contact: {}
  description: Asset management backend API.
  title: Hzzt API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.changePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: INVALID_CURRENT_PASSWORD
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change password (revokes all other sessions)
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always responds 200, whether or not the email is registered.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Request a password reset email
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Revoke the current refresh token family and clear the cookie
      tags:
      - auth
  /auth/logout-all:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Revoke all of the user's refresh tokens
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /auth/refresh:
    post:
      description: Reads the httpOnly `rt` cookie. Presenting an already-rotated token
        revokes the whole token family (REFRESH_TOKEN_REUSED).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "401":
          description: REFRESH_TOKEN_INVALID / REFRESH_TOKEN_REUSED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Rotate the refresh token and get a new access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: EMAIL_ALREADY_REGISTERED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Register an account
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.resetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: RESET_TOKEN_INVALID
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Reset password with an emailed token (revokes all sessions)
      tags:
      - auth
  /categories/suggestions:
    get:
      parameters:
      - description: EXPENSE or INCOME
        in: query
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Suggested category names
      tags:
      - categories
  /currencies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/currency.Currency'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List supported currencies
      tags:
      - currency
  /fx/latest:
    get:
      description: rates[Q] is how many Q one unit of `base` buys. `asOf` is null
        and `rates` empty until the first provider refresh has completed.
      parameters:
      - description: Base currency (default USD)
        in: query
        name: base
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/currency.LatestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Latest FX rates re-based to a currency
      tags:
      - currency
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.StatusResponse'
      summary: Liveness check
      tags:
      - health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.StatusResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Readiness check (database)
      tags:
      - health
  /investment-types:
    get:
      description: 'Per asset type: the fixed or free quote currency, whether automatic
        pricing is supported, how quantity is expressed (ID_STOCK uses lots; quantity
        = lots × 100) and the fields of `details`.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/investments.TypeMeta'
            type: array
      security:
      - BearerAuth: []
      summary: Investment type metadata for dynamic forms
      tags:
      - investments
  /invitations/{code}/accept:
    post:
      parameters:
      - description: Invitation code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/spaces.SpaceDTO'
        "409":
          description: ALREADY_A_MEMBER
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: INVITATION_INVALID / INVITATION_EXPIRED / SPACE_MEMBER_LIMIT
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Join a space with an invitation code (as MEMBER)
      tags:
      - spaces
  /market/crypto/search:
    get:
      description: Served from the local coin list (no provider call). Exact symbol
        matches first, then symbol prefixes, then name matches, each ordered by market-cap
        rank. Send the chosen `instrumentId` when creating an AUTO crypto investment.
      parameters:
      - description: Search text
        in: query
        name: q
        required: true
        type: string
      - description: Max results (default 20, max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/marketdata.InstrumentDTO'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Search coins by symbol or name
      tags:
      - market
  /market/stocks/search:
    get:
      description: Checks the local instrument list first and asks Massive too when
        there are fewer than 5 local hits (throttled; results are cached as instruments).
        If the provider is throttled or unavailable the local hits are returned. Send
        the chosen `instrumentId` when creating an AUTO US_STOCK (kind=STOCK) or GLOBAL_ETF
        (kind=ETF) investment. Limited to 20 requests per minute per user.
      parameters:
      - description: Search text
        in: query
        name: q
        required: true
        type: string
      - description: STOCK (default) or ETF
        in: query
        name: kind
        type: string
      - description: Max results (default 20, max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/marketdata.InstrumentDTO'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Search US stocks and ETFs by ticker or name
      tags:
      - market
  /me:
    delete:
      consumes:
      - application/json
      description: Blocked with OWNERSHIP_TRANSFER_REQUIRED while I own a space that
        has other members.
      parameters:
      - description: Password confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.deleteRequest'
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: OWNERSHIP_TRANSFER_REQUIRED / INVALID_CURRENT_PASSWORD
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete my account
      tags:
      - me
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get my profile (includes lastActiveSpaceId)
      tags:
      - me
    patch:
      consumes:
      - application/json
      parameters:
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.patchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update my name and/or timezone
      tags:
      - me
  /me/app-lock:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.disableAppLockRequest'
      responses:
        "204":
          description: No Content
        "422":
          description: INVALID_CURRENT_PASSWORD / APP_LOCK_NOT_ENABLED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Disable the app lock (requires the account password)
      tags:
      - me
    post:
      consumes:
      - application/json
      description: 'The app lock is a client-side UX gate that syncs across devices,
        NOT a security boundary: API access is governed by the JWT alone.'
      parameters:
      - description: PIN (4 to 6 digits) and account password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.enableAppLockRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: APP_LOCK_ALREADY_ENABLED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: INVALID_CURRENT_PASSWORD
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Enable the app lock
      tags:
      - me
  /me/app-lock/pin:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Current and new PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.changePINRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: INVALID_PIN / APP_LOCK_NOT_ENABLED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: APP_LOCK_TEMPORARILY_LOCKED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change the app-lock PIN (a wrong current PIN counts toward the lockout)
      tags:
      - me
  /me/app-lock/verify:
    post:
      consumes:
      - application/json
      description: 5 consecutive wrong PINs lock verification for 5 minutes (429 APP_LOCK_TEMPORARILY_LOCKED
        with details.retryAfter in seconds). Rate limited to 10/min per user. Client-side
        UX gate only.
      parameters:
      - description: PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.verifyAppLockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.VerifyResponse'
        "422":
          description: APP_LOCK_NOT_ENABLED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: APP_LOCK_TEMPORARILY_LOCKED / RATE_LIMITED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Verify the app-lock PIN
      tags:
      - me
  /me/preferences:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.PreferencesDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get my preferences (defaults are created on registration)
      tags:
      - me
    patch:
      consumes:
      - application/json
      parameters:
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.patchPreferencesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.PreferencesDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update my preferences
      tags:
      - me
  /me/shared-investment-invitations:
    get:
      description: Invitations addressed to my account or to my account's email (case-insensitive),
        including ones sent before I registered. Shows the investment and my share,
        never the owner's space.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/investments.InvitationDTO'
            type: array
      security:
      - BearerAuth: []
      summary: My pending shared-investment invitations
      tags:
      - sharing
  /me/shared-investment-invitations/{participantId}/accept:
    post:
      consumes:
      - application/json
      description: The investment is attached to the given space (you must be a member
        of it, and it must not be the owner's space); that space then counts my share
        and lists it with `include=shared`.
      parameters:
      - description: Invitation (participant) ID
        in: path
        name: participantId
        required: true
        type: string
      - description: Space to attach it to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/investments.acceptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/investments.AcceptResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: SHARE_INVITATION_ANSWERED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Accept a shared-investment invitation
      tags:
      - sharing
  /me/shared-investment-invitations/{participantId}/decline:
    post:
      parameters:
      - description: Invitation (participant) ID
        in: path
        name: participantId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: SHARE_INVITATION_ANSWERED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Decline a shared-investment invitation (the share stays allocated until
        the owner changes it)
      tags:
      - sharing
  /me/shared-investments/{participantId}/leave:
    post:
      description: My share stays allocated but becomes a name-only participant; the
        owner finds the change in the audit trail.
      parameters:
      - description: My participant ID
        in: path
        name: participantId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: SHARE_OWNER_CANNOT_LEAVE
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
